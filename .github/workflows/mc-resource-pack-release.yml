name: Build Minecraft resource pack

on:
  push:
    branches: [main]
    paths:
      - mc-resource-packs/**
      - .github/workflows/mc-resource-pack-release.yml
      - .github/scripts/build-resource-pack.py

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SERVER_VERSION: "26.2"
      PACK_BASE_NAME: Combined-Packs
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for packs
        id: packs
        run: |
          if compgen -G 'mc-resource-packs/*.zip' >/dev/null; then
            echo 'found=true' >> "$GITHUB_OUTPUT"
          else
            echo 'No resource pack zips found; skipping release.'
            echo 'found=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Pick next pack version
        if: steps.packs.outputs.found == 'true'
        run: |
          last=$(gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | grep -E "^${SERVER_VERSION}-0\.[0-9]+$" \
            | sed "s/^${SERVER_VERSION}-0\.//" \
            | sort -n \
            | tail -1)
          next=$((${last:-0} + 1))
          echo "PACK_VERSION=${SERVER_VERSION}-0.${next}" >> "$GITHUB_ENV"
          echo "PACK_NAME=${PACK_BASE_NAME}-${SERVER_VERSION}-0.${next}.zip" >> "$GITHUB_ENV"

      - name: Build combined pack
        if: steps.packs.outputs.found == 'true'
        run: python .github/scripts/build-resource-pack.py

      - name: Create release
        if: steps.packs.outputs.found == 'true'
        run: |
          gh release create "$PACK_VERSION" \
            "dist/$PACK_NAME" \
            --title "$PACK_VERSION" \
            --notes-file dist/release-notes.txt
